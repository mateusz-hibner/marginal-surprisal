[project]
name = "marginal-surprisal"
version = "0.2.0"
description = "Character-level surprisal from causal LMs, marginalized over tokenizations (Giulianelli et al., 2024)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "torch>=2.10.0",
    "transformers==4.57.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "sentencepiece>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
